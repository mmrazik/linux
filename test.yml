trigger: none

parameters:
- name: mode
  type: string
  default: blobless
  values:
  - shallow
  - blobless
  - sparse

pool:
  vmImage: ubuntu-latest

variables:
  system.debug: false

steps:
- checkout: self
  fetchDepth: 1
  fetchTags: false

  ${{ if ne(parameters.mode, 'shallow') }}:
    fetchFilter: 'blob:none'

  ${{ if eq(parameters.mode, 'sparse') }}:
    sparseCheckoutPatterns: '/Documentation/'

  env:
    GIT_TRACE: '1'
